<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEDIBAF | Matériel médical et paramédical en ligne</title>
<meta name="description" content="MEDIBAF, boutique en ligne de matériel médical, équipements de diagnostic, consommables et produits d'hygiène. Prix en FCFA, livraison à Brazzaville.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#app">Aller au contenu</a>

<header class="header">
  <div class="wrap bar">
    <a href="#/" class="logo" aria-label="MEDIBAF, accueil">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z" fill="#5BB4F0"/></svg>
      <span>MEDIBAF</span>
    </a>
    <form class="search" id="searchForm" role="search">
      <label class="sr" for="q">Rechercher un produit</label>
      <input id="q" type="search" placeholder="Rechercher un produit, une catégorie" autocomplete="off">
      <button type="submit" aria-label="Lancer la recherche"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    </form>
    <a href="#/panier" class="cartlink" aria-label="Panier">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.5 11h10L20 7H6"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>
      <span id="cartCount" class="badge">0</span>
    </a>
    <button class="burger" id="burger" aria-label="Ouvrir le menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
  <nav class="nav" id="nav" aria-label="Navigation principale">
    <div class="wrap">
      <a href="#/">Accueil</a><a href="#/catalogue">Catalogue</a><a href="#/a-propos">À propos</a><a href="#/contact">Contact</a>
    </div>
  </nav>
</header>

<main id="app" tabindex="-1"></main>

<footer class="footer">
  <div class="wrap fgrid">
    <div><div class="logo light"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z" fill="#5BB4F0"/></svg><span>MEDIBAF</span></div>
      <p>Équipements et produits médicaux et paramédicaux, accessibles en ligne.</p></div>
    <div><h4>Boutique</h4><a href="#/catalogue">Catalogue</a><a href="#/panier">Panier</a><a href="#/commande">Commande</a></div>
    <div><h4>Informations</h4><a href="#/a-propos">À propos</a><a href="#/contact">Contact</a></div>
    <div><h4>Contact</h4><p id="footContact"></p></div>
  </div>
  <div class="wrap copy">© <span id="year"></span> MEDIBAF. Tous droits réservés.</div>
</footer>
<div id="toasts" aria-live="polite"></div>
<script src="script.js"></script>
